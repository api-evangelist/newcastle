- aid: newcastle:data-ncl
  name: data.ncl Research Data Repository (Figshare tenancy)
  x-operator: tenant
  x-operator-evidence: >-
    data.ncl.ac.uk is a CNAME to figshare.com. The domain is Newcastle's and the data, the
    collections and the DOIs are Newcastle's, but the API contract, the OAuth scheme and the DOI
    minting are Figshare's product. Figshare's generic specification is deliberately NOT saved under
    this institution — this entry records the tenancy, which is a real institutional fact, without
    crediting Newcastle for Figshare's engineering.
  x-vendor: figshare
  description: >-
    Newcastle University's institutional research data repository, operated for the university by
    Figshare on a Newcastle-branded custom domain. Programmatic access exists but runs entirely on
    Figshare's API, authentication and DOI infrastructure. Probing data.ncl.ac.uk from a non-browser
    client returns an empty HTTP 202 from the Figshare edge, a bot challenge rather than a dead host.
  humanURL: https://data.ncl.ac.uk/
