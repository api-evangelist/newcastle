- aid: newcastle:ecppec
  name: ECPPEC Electoral Data GraphQL API
  x-operator: institution
  x-operator-evidence: >-
    api-ecppec.ncl.ac.uk resolves to a10-vip-ecppec.ncl.ac.uk (128.240.212.230), inside Newcastle
    University's own network and under its own registrable domain. The GraphQL server path
    disclosed in error output is /home/ecppec/graphql-server/ECPPEC/graphql. No vendor identity
    appears in the schema, the host or the errors.
  description: >-
    A GraphQL API over the Eighteenth-Century Political Participation and Electoral Culture research
    dataset — historical British elections, constituencies, candidates, poll books, voters, votes,
    occupations, geocodes and cultural artefacts. Nineteen root queries, no mutations, open
    unauthenticated introspection. Verified live 2026-08-30. Note that the previously catalogued
    endpoint ecppec.ncl.ac.uk/api/ is a WordPress documentation page, not the API; the API is at
    api-ecppec.ncl.ac.uk.
