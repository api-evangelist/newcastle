aid: newcastle
name: Newcastle University
x-type: university
x-category: Public Research University
description: >-
  Newcastle University is a public research university in Newcastle upon Tyne, United Kingdom, and a
  member of the Russell Group. Its programmable footprint is genuinely its own but it is small,
  decentralised and unadvertised: there is no central developer portal, no API changelog, no status
  page and no developer support channel anywhere on ncl.ac.uk. What the institution actually operates
  and runs itself, verified live on 2026-08-30, is four things — the Urban Observatory API for the
  Urban Sciences Building (the largest open urban-sensing platform in the UK, on a domain Newcastle
  registered and serves from its own nameservers), the Library's Digitised Objects Repository Search
  and Data API, which publishes its own OpenAPI at /info/open-api and serves 15,482 digitised objects
  from Special Collections, the ECPPEC eighteenth-century electoral GraphQL API with open
  introspection, and an OAI-PMH 2.0 endpoint over the eTheses repository. Alongside these it operates
  a Shibboleth SAML 2.0 identity provider registered in the UK Access Management Federation with 168
  service providers under ncl.ac.uk, which is by volume the institution's largest machine-readable
  surface and is a login federation rather than a data API. Its research data repository, data.ncl,
  is a Figshare tenant: the data and the DOIs are Newcastle's, the API contract is Figshare's, and it
  is recorded here as a tenant relationship rather than credited to the university.
type: Index
x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated APIs and one identity federation were found, probed and verified live
    on 2026-08-30, and one vendor-platform tenancy was identified and labelled rather than credited.
    The profile is thin in developer-experience terms — no portal, no changelog, no status page, no
    support channel, no scopes and no versioning policy — and that thinness is a real measurement of
    the institution, not a gap in coverage. Two claims carried by the previous profile did not
    survive probing and were corrected: eprints.ncl.ac.uk does not expose OAI-PMH (it is an ASP.NET
    application and /cgi/oai2, /oai2 and /api all redirect to error_page.aspx), and the ECPPEC API
    does not live at ecppec.ncl.ac.uk/api/, which is a WordPress documentation page pointing at the
    real GraphQL host at api-ecppec.ncl.ac.uk.
