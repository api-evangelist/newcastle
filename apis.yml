  name: Newcastle University eTheses OAI-PMH Endpoint
  x-operator: institution
  x-operator-evidence: >-
    theses.ncl.ac.uk is under the university's own registrable domain and the Identify response
    names the repository "Newcastle University eTheses" with adminEmail lib-web@nclac.uk. The
    repository software is DSpace, a third party's; the deployment, the host and the endpoint are
