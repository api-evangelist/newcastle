name: Newcastle University — domain standard conformance
aid: newcastle
generated: '2026-08-30'
method: derived
x-evidence-method: probed
source: live probes of Newcastle University operated hosts, 2026-08-30
regime: education
note: >-
  Reward-only. Every entry below was confirmed by fetching the named URL and reading the response
  body, not by reading a prose claim. Standards from the education regime that were looked for and
  NOT found are listed under not_found so the absence is a measurement rather than a silence.
standards:
- standard: shibboleth
  status: conformant
  operator: institution
  evidence:
    url: https://gateway.ncl.ac.uk/idp/shibboleth
    status: 200
    content_type: application/xml
    detail: >-
      Newcastle University operates its own Shibboleth Identity Provider. The metadata document is
      served directly by the IdP at the entityID URL and declares shibmd:Scope ncl.ac.uk.
  entity_id: https://gateway.ncl.ac.uk/idp/shibboleth
  checked: '2026-08-30'
- standard: saml
  status: conformant
  operator: institution
  version: SAML 2.0
  evidence:
    url: https://gateway.ncl.ac.uk/idp/shibboleth
    status: 200
    detail: >-
      IDPSSODescriptor advertises SAML 2.0 SingleSignOnService bindings at
      /idp/profile/SAML2/Redirect/SSO, /idp/profile/SAML2/POST/SSO and
      /idp/profile/SAML2/POST-SimpleSign/SSO, plus the legacy Shibboleth 1 SSO profile.
  secondary_evidence:
    url: http://metadata.ukfederation.org.uk/ukfederation-metadata.xml
    status: 200
    detail: >-
      Newcastle University is registered in the UK Access Management Federation (which feeds
      eduGAIN) with two IdP entities — the production IdP above and
      https://dev-gateway.ncl.ac.uk/idp/shibboleth — and 168 Service Provider entities under
      ncl.ac.uk, including www.ncl.ac.uk, rattler.ncl.ac.uk (library server),
      researchtools.ncl.ac.uk, myimpact.ncl.ac.uk and www.myprojects.ncl.ac.uk.
  checked: '2026-08-30'
- standard: oai-pmh
  status: conformant
  operator: institution
  version: '2.0'
  evidence:
    url: https://theses.ncl.ac.uk/oai/request?verb=Identify
    status: 200
    content_type: text/xml
    detail: >-
      Identify returns repositoryName "Newcastle University eTheses", protocolVersion 2.0,
      granularity YYYY-MM-DDThh:mm:ssZ, earliestDatestamp 2008-09-18. ListMetadataFormats offers
      oai_dc, dim and uketd_dc (the UK Electronic Theses Online Service profile). The repository
      runs DSpace 6.3 on a Newcastle University host; the software is a third party's, the
      deployment and the endpoint are the institution's.
  metadata_formats:
  - oai_dc
  - dim
  - uketd_dc
  checked: '2026-08-30'
- standard: iiif
  status: conformant
  operator: institution
  in_regime: false
  evidence:
    url: https://api-dor.ncl.ac.uk/info/open-api
    status: 200
    detail: >-
      The Digitised Objects Repository OpenAPI declares an IIIF tag and a GET /iiif/{id} operation
      for image delivery from Special Collections. Recorded for completeness; IIIF is not one of the
      education regime's named standards and must not be scored as one.
  checked: '2026-08-30'
- standard: tei
  status: conformant
  operator: institution
  in_regime: false
  evidence:
    url: https://api-dor.ncl.ac.uk/info/open-api
    status: 200
    detail: >-
      GET /v1/tei/{id}/content serves Text Encoding Initiative transcript content for digitised
      objects. Not an education-regime standard; recorded, not scored.
  checked: '2026-08-30'
not_found:
- standard: scim
  detail: No SCIM 2.0 provisioning endpoint is publicly discoverable on any ncl.ac.uk host.
- standard: lti
  detail: >-
    Newcastle runs Canvas as its VLE, which is LTI 1.3 capable, but the platform is a vendor's
    (Instructure) and no institution-operated LTI registration or tool endpoint is public.
- standard: oneroster
  detail: No OneRoster endpoint found.
- standard: ed-fi
  detail: Ed-Fi is a US K-12/state-agency standard; not applicable to a UK university.
- standard: caliper
  detail: No public Caliper analytics endpoint found.
- standard: qti
  detail: No public QTI item bank or assessment endpoint found.
- standard: orcid
  detail: >-
    ORCID identifiers appear in Newcastle research profiles, but the surface that carries them
    (data.ncl.ac.uk) is a Figshare tenant, so the contract is the vendor's and no
    institution-operated ORCID integration endpoint was found.
- standard: datacite
  detail: >-
    Newcastle mints DataCite DOIs for research data, but it does so through its Figshare tenant at
    data.ncl.ac.uk; the DOI minting contract belongs to Figshare, not to the institution.
- standard: crossref
  detail: No institution-operated Crossref deposit or query surface found.
